name: Build arm64-v8a

on:
  push:
    branches: [ci-arm64]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      output: "${{ github.workspace }}/android/app/build/outputs/apk/release"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download AList Source Code
        run: |
          cd $GITHUB_WORKSPACE/alist-lib/scripts
          chmod +x *.sh
          ./init_alist.sh
          ./init_web.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build AList (arm64 only)
        run: |
          cd $GITHUB_WORKSPACE/alist-lib/scripts
          chmod +x *.sh
          ./init_gomobile.sh
          ./gobind.sh debug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.7'

      - name: Restrict ABI to arm64-v8a only
        run: |
          cd $GITHUB_WORKSPACE/android/app
          sed -i "s/include 'armeabi-v7a', 'arm64-v8a', 'x86_64'/include 'arm64-v8a'/" build.gradle
          sed -i "s/universalApk true/universalApk false/" build.gradle
          sed -i 's/abiFilters "arm64-v8a"//' build.gradle
          grep -n "arm64-v8a\|universalApk" build.gradle

      - name: Build APK (arm64-v8a only)
        run: |
          cd $GITHUB_WORKSPACE/android
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "flutter.sdk=${FLUTTER_ROOT}" >> local.properties
          fi
          gradle --version
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "AListFlutter-arm64-v8a"
          path: "${{ env.output }}/*-v8a.apk"
